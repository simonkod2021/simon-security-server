name: Build and Test

on:
  push:
    branches: [ "**" ]   # Run on every branch
  pull_request:
    branches: [ "**" ]   # Run on every PR

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # 1. Checkout project repository
      # ------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------
      # 2. Set up Java (change version if needed)
      # ------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # ------------------------------
      # 3. Build the project
      # ------------------------------
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # ------------------------------
      # 4. Run all unit and integration tests
      # ------------------------------
      - name: Run tests
        run: mvn test
